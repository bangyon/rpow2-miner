[package]
name = "rpow2-miner"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "cookies"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num_cpus = "1"

[profile.release]
opt-level = 3
lto = true
